# 量化 Hub-and-Spoke：三个独立沙盒（研究员 / 工程 / 测试）
# 启动：在 deploy/quant-hub-spoke 目录执行
#   docker compose up -d
# 说明：容器常驻以便 Hub 通过 exec 在隔离环境中执行命令；OpenClaw 各 agent 的 workspace
#       建议指向下方 bind mount 在宿主机上的同一目录（见 README.md）。

services:
  quant-research:
    image: python:3.12-slim
    container_name: quant-research
    working_dir: /workspace
    volumes:
      - ./workspaces/research:/workspace
    command: ["sh", "-c", "echo research sandbox ready && tail -f /dev/null"]
    networks:
      - quant-hub-net
    restart: unless-stopped

  quant-engineering:
    image: python:3.12-slim
    container_name: quant-engineering
    working_dir: /workspace
    volumes:
      - ./workspaces/engineering:/workspace
    command: ["sh", "-c", "echo engineering sandbox ready && tail -f /dev/null"]
    networks:
      - quant-hub-net
    restart: unless-stopped

  quant-qa:
    image: python:3.12-slim
    container_name: quant-qa
    working_dir: /workspace
    volumes:
      - ./workspaces/qa:/workspace
    command: ["sh", "-c", "echo qa sandbox ready && tail -f /dev/null"]
    networks:
      - quant-hub-net
    restart: unless-stopped

networks:
  quant-hub-net:
    name: quant-hub-net
    driver: bridge
